name: refrigerator_app
description: AI 기반 냉장고 관리 및 맞춤형 레시피 추천 앱
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP 통신
  http: ^1.2.0
  dio: ^5.4.0

  # 상태 관리
  provider: ^6.1.1

  # 이미지 관련
  image_picker: ^1.0.7        # 카메라/갤러리에서 사진 선택
  cached_network_image: ^3.3.1 # 이미지 캐싱

  # 로컬 저장소
  shared_preferences: ^2.2.2   # JWT 토큰 등 간단한 데이터 저장

  # UI 컴포넌트
  flutter_slidable: ^3.0.1     # 슬라이드 삭제 버튼
  intl: ^0.19.0                # 날짜 포맷

  # URL 열기 (YouTube 링크 등)
  url_launcher: ^6.2.5

  # 로컬 푸시 알림 (유통기한 알람)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # 아이콘
  cupertino_icons: ^1.0.2
  camera: ^0.12.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
